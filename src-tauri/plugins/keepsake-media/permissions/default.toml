"$schema" = "schemas/schema.json"

[default]
description = "Allows the transcode command (Android audio conversion to M4A or WAV) and open_file (open a download in another app), and ytdlp_info / ytdlp_download (yt-dlp for TikTok and Instagram on Android)."
permissions = ["allow-transcode", "allow-open-file", "allow-ytdlp-info", "allow-ytdlp-download"]
